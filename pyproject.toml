[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qslab"
version = "0.1.0"
description = "Lightweight W4A16+KV4 LLM inference engine (qserve-lab)"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "triton==3.3.1; platform_system == 'Linux'",
    "numpy<2.1",
    "safetensors",
    "accelerate>=1.0",
]

[project.optional-dependencies]
# adapters layer only — qslab core must NOT import these
adapters = ["transformers==4.57.6", "tokenizers"]
# service surface only (qslab/api/server.py) — the core stays web-free
serve = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["qslab*", "adapters*"]

[tool.setuptools.package-data]
"qslab.kernels.gemlite" = ["LICENSE", "README.md"]
